<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSW365 — Links</title>
<meta name="description" content="HSW365 Media — Websites, streetwear, music, books, and speaking. Turn Negative Into Positive.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#0a0a0f; --panel:#12121a; --panel2:#16161f;
    --cyan:#22d3ee; --violet:#a855f7; --red:#ef4444; --yellow:#fbbf24;
    --text:#f4f4f6; --muted:#9a9aa8; --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--base);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  body{
    min-height:100vh;display:flex;justify-content:center;
    background:
      radial-gradient(600px 300px at 50% -5%, rgba(34,211,238,.10), transparent 60%),
      radial-gradient(500px 260px at 100% 0%, rgba(168,85,247,.10), transparent 60%),
      var(--base);
    padding:40px 20px 56px;
  }
  .wrap{width:100%;max-width:460px}
  .head{text-align:center;margin-bottom:30px}
  .logo{
    width:74px;height:74px;margin:0 auto 16px;border-radius:20px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(168,85,247,.18));
    border:1px solid var(--line);
    font-family:'Barlow Condensed';font-weight:800;font-size:26px;letter-spacing:1px;
    color:var(--text);
  }
  h1{font-family:'Barlow Condensed';font-weight:800;font-size:42px;letter-spacing:.5px;line-height:1}
  h1 span{color:var(--cyan)}
  .tag{
    font-family:'Space Mono';font-size:11px;letter-spacing:3px;text-transform:uppercase;
    color:var(--muted);margin-top:10px;
  }
  .links{display:flex;flex-direction:column;gap:13px;margin-top:8px}
  a.btn{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);
    background:var(--panel);border:1px solid var(--line);border-radius:15px;
    padding:17px 18px;transition:transform .15s ease, border-color .15s ease, background .15s ease;
    position:relative;overflow:hidden;
  }
  a.btn:active{transform:scale(.985)}
  a.btn:hover{background:var(--panel2)}
  a.btn .bar{width:4px;align-self:stretch;border-radius:4px;flex:0 0 4px}
  a.btn .txt{flex:1;min-width:0}
  a.btn .label{font-family:'Barlow Condensed';font-weight:700;font-size:20px;letter-spacing:.4px;line-height:1.05}
  a.btn .sub{font-size:12px;color:var(--muted);margin-top:3px}
  a.btn .arrow{color:var(--muted);font-size:18px;flex:0 0 auto}
  .c-cyan .bar{background:var(--cyan)} .c-cyan:hover{border-color:rgba(34,211,238,.45)}
  .c-violet .bar{background:var(--violet)} .c-violet:hover{border-color:rgba(168,85,247,.45)}
  .c-red .bar{background:var(--red)} .c-red:hover{border-color:rgba(239,68,68,.45)}
  .c-yellow .bar{background:var(--yellow)} .c-yellow:hover{border-color:rgba(251,191,36,.45)}
  .foot{text-align:center;margin-top:34px}
  .foot .mail{font-family:'Space Mono';font-size:12px;color:var(--muted);text-decoration:none}
  .foot .mail:hover{color:var(--cyan)}
  .foot .copy{font-family:'Space Mono';font-size:10px;letter-spacing:1.5px;color:#5a5a66;margin-top:10px;text-transform:uppercase}
</style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div class="logo">HSW</div>
      <h1>HSW<span>365</span></h1>
      <div class="tag">Turn Negative Into Positive</div>
    </header>

    <nav class="links">
      <a class="btn c-cyan" href="https://hsw365.github.io/QUEENEE.github.io/index.html" target="_blank" rel="noopener">
        <span class="bar"></span>
        <span class="txt"><span class="label">QUEENEE.io</span><span class="sub">Professional websites for your business</span></span>
        <span class="arrow">&#8599;</span>
      </a>
      <a class="btn c-violet" href="https://hsw365.co" target="_blank" rel="noopener">
        <span class="bar"></span>
        <span class="txt"><span class="label">Shop HSW365</span><span class="sub">Streetwear &middot; Digital products &middot; Apps</span></span>
        <span class="arrow">&#8599;</span>
      </a>
      <a class="btn c-red" href="https://open.spotify.com/artist/5WcRHq9ZX0GElx4wSvVjrr" target="_blank" rel="noopener">
        <span class="bar"></span>
        <span class="txt"><span class="label">Music</span><span class="sub">Stream on Spotify</span></span>
        <span class="arrow">&#8599;</span>
      </a>
      <a class="btn c-yellow" href="mailto:book@hoodstar365.com?subject=Speaking%20Booking%20Inquiry" rel="noopener">
        <span class="bar"></span>
        <span class="txt"><span class="label">Book Me to Speak</span><span class="sub">The Journey Continues Tour</span></span>
        <span class="arrow">&#8599;</span>
      </a>
      <a class="btn c-cyan" href="https://cash.app/$hsw365" target="_blank" rel="noopener">
        <span class="bar"></span>
        <span class="txt"><span class="label">Support / Cash App</span><span class="sub">$hsw365</span></span>
        <span class="arrow">&#8599;</span>
      </a>
    </nav>

    <footer class="foot">
      <a class="mail" href="mailto:hsw365media@gmail.com">hsw365media@gmail.com</a>
      <div class="copy">&copy; 2026 HSW365 Media LLC</div>
    </footer>
  </main>
</body>
</html>
